name: build-windows-b

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu torchvision==0.20.1+cpu

      - name: Install build dependencies
        run: |
          pip install -r requirements-build.txt

      - name: Build B
        run: |
          pyinstaller --noconfirm --clean --onedir `
            --name alcon_B `
            --collect-all torch `
            --collect-all torchvision `
            --collect-all transformers `
            app/run_b.py

      - name: Copy student model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\alcon_B\weights
          Copy-Item weights\student_distilled.pt dist\alcon_B\weights\student_distilled.pt -Force

      - name: Package runtime
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\alcon_B\* `
            -DestinationPath alcon_B_runtime.zip `
            -CompressionLevel Optimal

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: alcon-B-runtime
          path: alcon_B_runtime.zip